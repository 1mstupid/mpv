# mpv 快捷键绑定（已清理：仅保留可用的绑定）
RIGHT            seek  5                                                                                                #menu: 导航 > 前进后退 > 前进 5 秒
LEFT             seek -5                                                                                                #menu: 导航 > 前进后退 > 后退 5 秒
UP               seek  60                                                                                               #menu: 导航 > 前进后退 > 前进 1 分钟
DOWN             seek -60                                                                                               #menu: 导航 > 前进后退 > 后退 1 分钟
