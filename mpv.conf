vo=gpu-next                           
gpu-api=vulkan                        
title=${?pause==yes:⏸}${?mute==yes:🔇}${?ontop==yes:📌}${?demuxer-via-network==yes:${media-title}}${?demuxer-via-network==no:${filename}}
osc=no                                
no-title-bar                          
input-ime=no                          
idle=yes                              
ontop                                 
snap-window=yes                       
hr-seek=yes                           
hr-seek-framedrop=no                  
save-position-on-quit=yes             
write-filename-in-watch-later-config  
resume-playback-check-mtime=yes       
watch-later-dir="~/.cache/watch_later"                                      
watch-later-options=start,vid,aid,sid
save-watch-history=yes                
watch-history-path=~/.cache/files/watch_history.jsonl
reset-on-next-file=vid,aid,sid,secondary-sid,vf,af,loop-file,deinterlace,contrast,brightness,gamma,saturation,hue,video-zoom,video-rotate,video-pan-x,video-pan-y,panscan,speed,audio-delay,sub-pos,sub-scale,sub-delay,sub-speed,sub-visibility,secondary-sub-visibility
directory-mode=ignore                 
metadata-codepage=auto                
msg-level=all=info,auto_profiles=warn                                      
                                      

#######
# OSD #
#######

no-osd-bar
osd-on-seek=msg-bar                   
osd-bar-w=100
osd-bar-h=2
osd-bar-align-y=-1
#osd-fonts-dir=./fonts               
osd-font="Noto Sans Mono CJK SC"      
osd-font-size=24                      
osd-color="#FFFFFF"                   
osd-outline-size=1.0                  
osd-outline-color="#1C1B1F"           
osd-shadow-offset=0                   
osd-back-color="#1C1B1F"              
osd-border-style=outline-and-shadow   
                                      
osd-playlist-entry=filename           
osd-status-msg=${playback-time/full} / ${duration/full} (${percent-pos}%)\nframe: ${estimated-frame-number} / ${estimated-frame-count}
                                      
osd-fractions=yes                     
osd-duration=2000                     
audio-device=auto                                                          
audio-channels=7.1,5.1,stereo         
ao=pipewire                             
                                      
gapless-audio=no                      
                                      
audio-file-auto=fuzzy                 
audio-file-paths=audio;audios;audio 5.1;audios 5.1;audio 7.1;audios 7.1;音轨
alang=english,eng,en
sub-codepage=gb18030                          
sub-auto=fuzzy                                # <no|默认 exact|fuzzy|all> 指定自动加载外部字幕的方式
sub-file-paths=sub;subs;subtitles;字幕
slang=eng,en,english

sub-font="Noto Sans CJK SC"  
sub-font-size=50             
sub-bold=yes                 
sub-color="#FFFFFF"          
sub-outline-size=0.5         
sub-outline-color="#000000"  
sub-shadow-offset=0.5        
sub-back-color="#000000"     
screenshot-format=webp       
screenshot-webp-quality=85   
screenshot-webp-compression=6
screenshot-tag-colorspace=no 
screenshot-template="./files/screen/%{media-title}-%P-%n"

gpu-shader-cache-dir="./cache/shaders_cache"

load-context-menu=yes                        

input-default-bindings=no                    

profile=Target                                
profile=Dither                                
#profile=Dither+                              
profile=Tscale                                
profile=HQ                                    
profile=DeBand-low                            
profile=HDR2SDR                               

[ICC]
 icc-profile=""
 icc-profile-auto
 icc-intent=0
 icc-force-contrast=1000
 icc-3dlut-size=auto
 icc-cache-dir="./cache/icc_cache"

[ICC+]
 icc-profile="./icc/ITU-RBT709ReferenceDisplay.icc"
 icc-intent=0
 icc-force-contrast=no
 icc-3dlut-size=auto
 icc-cache-dir="./cache/icc_cache"

[Target]
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 #target-trc=gamma2.2
 #target-peak=203
 target-contrast=auto
 #sdr-adjust-gamma=no
 #treat-srgb-as-power22=no

[Dither]
 dither-depth=auto
 dither=fruit
 dither-size-fruit=6

[Dither+]
 dither-depth=auto
 dither=error-diffusion
 error-diffusion=floyd-steinberg

[Tscale]
 video-sync=display-resample
 #video-sync-max-video-change=5
 interpolation
 #interpolation-preserve=no
 tscale=oversample

[Tscale+]
 video-sync=display-resample
 #video-sync-max-video-change=5
 interpolation
 #interpolation-preserve=no
 tscale=sphinx
 tscale-blur=0.65

[HQ]
 scale=ewa_lanczossharp
 cscale=bilinear
 dscale=catmull_rom
 scale-antiring=0.5
 dscale-antiring=0.5
 linear-upscaling=no
 sigmoid-upscaling=yes
 correct-downscaling=yes
 linear-downscaling=no
 #scaler-resizes-only=no
 deband=no

[DeBand-low]
 profile-desc=DeBand low
 deband-iterations=1
 deband-threshold=48
 deband-range=16
 deband-grain=16

[DeBand-medium]
 profile-desc=deband medium
 deband-iterations=2
 deband-threshold=64
 deband-range=16
 deband-grain=24

[DeBand-high]
 profile-desc=deband high
 deband-iterations=3
 deband-threshold=64
 deband-range=16
 deband-grain=24

[HDR2SDR]
 profile-desc=HDR-SDR 映射参数
 tone-mapping=auto
 gamut-mapping-mode=auto
 hdr-contrast-recovery=0.30
 hdr-compute-peak=auto
 hdr-peak-percentile=99.995
 hdr-peak-decay-rate=20
 hdr-scene-threshold-low=1.0
 hdr-scene-threshold-high=3.0
 allow-delayed-peak-detect=no

[SDR2HDR]
 profile-desc=SDR 反向映射 HDR 参数
 icc-profile=""
 icc-profile-auto=no
 target-prim=auto
 #target-gamut=dci-p3   # 或 adobe，用于 argb 色域
 target-trc=auto
 target-peak=auto 
 target-colorspace-hint=auto
 inverse-tone-mapping=yes

[SWscaler]
 profile-desc=软件缩放配置
 sws-allow-zimg=no                  
 sws-scaler=bicublin                
                                    
 zimg-scaler-chroma=bicubic         
                                    
 zimg-scaler=bicubic                
 zimg-scaler-param-a=1/3            
 zimg-scaler-param-b=1/3
 zimg-fast=no                       


[ravu-zoom]
 profile-desc=适用于大多数场景
 glsl-shaders="./shaders/ravu/ravu-zoom-ar-r3.glsl;./shaders/igv/adaptive-sharpen_luma.glsl"

[FSRCNNX]
 profile-desc=适用于 HD 场景
 glsl-shaders="./shaders/igv/FSRCNNX_x2_8-0-4-1.glsl;./shaders/igv/adaptive-sharpen_luma.glsl"

[Ani4K]
 profile-desc=Ani4K
 profile-desc=适用于大多数动画
 glsl-shaders="./shaders/Ani4K/Ani4Kv2_ArtCNN_C4F32_i2.glsl"

[AniSD]
 profile-desc=AniSD
 profile-desc=适用于 SD 动画
 glsl-shaders="./shaders/Ani4K/AniSD_ArtCNN_C4F32_i4.glsl"

[Anime4K]
 profile-desc=Anime4K
 profile-desc=适用于大多数动画
 glsl-shaders="./shaders/igv/KrigBilateral.glsl;./shaders/Anime4K/glsl/Restore/Anime4K_Restore_CNN_Soft_M.glsl;./shaders/Anime4K/glsl/Restore/Anime4K_Clamp_Highlights.glsl"

[SSIM]
 profile-desc=适用于 4k 低性能
 glsl-shaders="./shaders/igv/SSimSuperRes.glsl;./shaders/igv/SSimDownscaler.glsl"

[SD]
 profile-desc=低清源增强
 profile-cond=height <= 720 or width <= 720
 profile-restore=copy
 profile=FSRCNNX+

[Deband]
 profile-desc=YUV420P10 以下的源开启去色带 # 8k 视频下强制禁用
 profile-cond=get("video-params/average-bpp") < 24 and not (get("video-params/w") > 7000 or get("video-params/h") > 3000)
 profile-restore=copy
 deband=yes

[hdr-2390]
 profile-cond=p.tone_mapping == "bt.2390" and p.current_vo == "gpu-next"
 profile-restore=copy
 tone-mapping-param=2.0

#[hdr-spline]
#profile-cond=p.tone_mapping == "spline"
#profile-restore=copy
#tone-mapping-param=1.0

[peak-percentile]
 profile-cond=get("video-params/avg-pq-y") < 0.21 and p.current_vo == "gpu-next"
 profile-restore=copy
 hdr-peak-percentile=99.8

[SDR-gamut]
 profile-desc=SDR 内容的色域映射
 profile-cond=get("video-params/primaries") ~= "bt.709" and get("video-params/gamma") == "bt.1886"
 profile-restore=copy
 gamut-mapping-mode=clip

[SDR-target]
 profile-desc=SDR 显示目标配置
 profile-cond=get("video-params/gamma") == "bt.1886" and not get("inverse-tone-mapping") and p.current_vo == "gpu-next"
 profile-restore=copy
 target-colorspace-hint=no

[HDR]
 profile-desc=HDR 配置
 profile-cond=get("video-params/max-luma") > 203
 profile-restore=copy
 target-peak=auto
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 hdr-reference-white=100
 blend-subtitles=no
 deband=no
 vf=""

[HDR-PASS]
 profile-desc=HDR 直通参数，仅在 HDR 显示模式下生效
 profile-cond=get("video-params/max-luma") > 203 and get("video-target-params/max-luma") > 203 and p.current_vo == "gpu-next"
 profile-restore=copy
 icc-profile=""
 icc-profile-auto=no
 target-colorspace-hint=auto
 target-colorspace-hint-mode=target
 inverse-tone-mapping=no      
 target-prim=auto
 #target-trc=scrgb            
 #target-gamut=dci-p3         
 target-trc=auto
 target-peak=auto             
 target-contrast=auto         
 #sub-hdr-peak=100            
 #image-subs-hdr-peak=10000   

[video-sync]
 profile-desc=当音频调整速度超过阈值时改变音视频同步模式，以避免明显的音高变化
 profile-cond=(speed * audio_speed_correction) > 0 and ((speed * audio_speed_correction) < 0.96 or (speed * audio_speed_correction) > 1.04) and not (get("estimated-vf-fps") > 47 or get("display-fps") > 120)
 profile-restore=copy-equal
 video-sync=display-tempo

[fps-fix]
 profile-desc=修复视频帧率和显示刷新率过高引起的异常耗能或掉帧
 profile-cond=get("estimated-vf-fps") > 47 or get("display-fps") > 120
 profile-restore=copy
 video-sync=audio

[8k-fix]
 profile-desc=8k av1 下使用 d3d11va 硬解来解决掉帧问题，该方案仅限 --gpu-api=vulkan 下可用
 profile-cond=get("video-params/w") > 7000 or get("video-params/h") > 3000
 profile-restore=copy
 hwdec=auto-safe
 video-sync=audio
 glsl-shaders=""
 deband=no
 vf=""

[pgs-fix]
 profile-desc=修复国内电影压制的内封 pgs 字幕画幅比例与视频不一致导致的字幕错位
 profile-cond=get("video-params/aspect") > 16 / 9
 profile-restore=copy
 stretch-image-subs-to-screen=yes

[pause]
 profile-desc=暂停时取消置顶
 profile-cond=pause
 profile-restore=copy
 ontop=no

[maximized]
 profile-desc=最大化时取消窗口大小自动调整
 profile-cond=window_maximized and vid and not get("current-tracks/video/albumart")
 profile-restore=copy-equal
 auto-window-resize=no

[minimized]
 profile-desc=最小化时暂停
 profile-cond=window_minimized and video_format and not get("current-tracks/video/albumart") and not idle_active
 profile-restore=copy-equal
 pause

[end]
 profile-desc=播放列表结束后退出全屏
 profile-cond=idle_active
 no-fullscreen
 no-window-maximized

[media-title]
 profile-desc=特殊协议下切换窗口标题显示内容
 profile-cond=path:find('://') ~= nil or path:find('^magnet:') ~= nil
 #profile-cond=demuxer_via_network == true
 profile-restore=copy
 title=${?pause==yes:⏸}${?mute==yes:🔇}${?ontop==yes:📌}${media-title}
 osd-playlist-entry=title

[audio]
profile-desc=音乐
profile-cond=aid and (not vid or get("current-tracks/video/albumart"))
profile-restore=copy
glsl-shaders=""
watch-later-options=edition,volume,aid,vid,sid,secondary-sid
